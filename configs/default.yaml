# NICTO Default Configuration
# All values can be overridden by environment-specific configs

model:
  latent_dim: 512
  hidden_dim: 2048
  num_heads: 16
  num_layers: 24
  vocab_size: 32000
  max_seq_len: 4096
  dropout: 0.1
  activation: silu

generation:
  num_steps: 20
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  cfg_scale: 7.5
  num_points_3d: 2048
  video_frames: 16
  audio_duration: 5.0
  batch_size: 1

training:
  lr: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 1000
  max_steps: 100000
  batch_size: 32
  grad_accumulation: 4
  max_grad_norm: 1.0
  fp16: true
  checkpoint_every: 1000
  eval_every: 500
  log_every: 10

api:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  cors_origins:
    - "*"
  max_batch_size: 32
  timeout_s: 300

data:
  data_dir: "data"
  cache_dir: "cache"
  max_seq_len: 4096
  num_workers: 4
  pin_memory: true

device: auto
seed: 42
debug: false
log_level: INFO

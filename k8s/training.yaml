# NICTO AI - Kubernetes Training Cluster
# For full-scale training on multi-GPU A100 cluster
# Estimated cost: $20-40/hour for 8x A100-80GB
#
# Prerequisites:
#   - AKS cluster with GPU nodes (Standard_ND96asr_v4 or similar)
#   - kubectl configured
#   - Storage class with ReadWriteMany support (NFS or Azure Files)
#
# Usage:
#   kubectl apply -f k8s/
#   kubectl logs -f nicto-trainer-0
#   kubectl delete -f k8s/

---
apiVersion: v1
kind: Namespace
metadata:
  name: nicto-training

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: training-config
  namespace: nicto-training
data:
  CONFIG: "k8s"
  DATA_PATH: "/data/training_data"
  CHECKPOINT_PATH: "/checkpoints"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: training-data
  namespace: nicto-training
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: azurefile-csi
  resources:
    requests:
      storage: 100Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: checkpoints
  namespace: nicto-training
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: azurefile-csi
  resources:
    requests:
      storage: 500Gi

---
apiVersion: v1
kind: Service
metadata:
  name: nicto-trainer
  namespace: nicto-training
spec:
  selector:
    app: nicto-trainer
  ports:
    - port: 6006
      name: tensorboard
  clusterIP: None

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nicto-trainer
  namespace: nicto-training
spec:
  serviceName: nicto-trainer
  replicas: 1
  selector:
    matchLabels:
      app: nicto-trainer
  template:
    metadata:
      labels:
        app: nicto-trainer
    spec:
      containers:
        - name: trainer
          image: pytorch/pytorch:2.4.0-cuda12.4-cudnn9-runtime
          command:
            - bash
            - -c
            - |
              pip install transformers psutil -q
              python -u nicto_ai/training/train.py --config k8s
          envFrom:
            - configMapRef:
                name: training-config
          resources:
            requests:
              cpu: "16"
              memory: "128Gi"
              nvidia.com/gpu: "8"
            limits:
              cpu: "32"
              memory: "256Gi"
              nvidia.com/gpu: "8"
          volumeMounts:
            - name: training-data
              mountPath: /data
            - name: checkpoints
              mountPath: /checkpoints
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      nodeSelector:
        accelerator: nvidia-a100-80gb
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

---
apiVersion: batch/v1
kind: Job
metadata:
  name: nicto-trainer-oneoff
  namespace: nicto-training
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: nicto-trainer
    spec:
      containers:
        - name: trainer
          image: pytorch/pytorch:2.4.0-cuda12.4-cudnn9-runtime
          command:
            - bash
            - -c
            - |
              pip install transformers psutil -q
              python -u nicto_ai/training/train.py --config k8s
          envFrom:
            - configMapRef:
                name: training-config
          resources:
            requests:
              cpu: "16"
              memory: "128Gi"
              nvidia.com/gpu: "8"
            limits:
              cpu: "32"
              memory: "256Gi"
              nvidia.com/gpu: "8"
          volumeMounts:
            - name: training-data
              mountPath: /data
            - name: checkpoints
              mountPath: /checkpoints
            - name: shm
              mountPath: /dev/shm
      restartPolicy: OnFailure
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      nodeSelector:
        accelerator: nvidia-a100-80gb
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

---
apiVersion: v1
kind: Pod
metadata:
  name: tensorboard
  namespace: nicto-training
spec:
  containers:
    - name: tensorboard
      image: tensorflow/tensorflow:latest
      command:
        - tensorboard
        - --logdir=/checkpoints
        - --host=0.0.0.0
      ports:
        - containerPort: 6006
      volumeMounts:
        - name: checkpoints
          mountPath: /checkpoints
  volumes:
    - name: checkpoints
      persistentVolumeClaim:
        claimName: checkpoints

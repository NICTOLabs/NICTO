[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nicto-ai"
version = "0.1.0"
description = "NICTO AI — open-source neural architecture with reasoning, memory, emotion, and consciousness"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "datasets>=2.0.0",
    "numpy>=1.24.0",
    "huggingface-hub>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
nicto = "nicto_ai.cli:main"

[tool.setuptools.packages.find]
include = ["nicto_ai*"]

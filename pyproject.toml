[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nicto-ai"
version = "0.1.0"
description = "NICTO AI - The World's Most Powerful Understanding Engine"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "NICTO AI Team"}
]
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "torchaudio>=2.4.0",
    "numpy>=1.26.0",
    "einops>=0.8.0",
    "flash-attn>=2.6.0",
    "triton>=3.0.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.26.0",
    "datasets>=3.1.0",
    "accelerate>=1.1.0",
    "transformers>=4.46.0",
    "sentencepiece>=0.2.0",
    "tiktoken>=0.8.0",
    "wandb>=0.18.0",
    "tensorboard>=2.17.0",
    "rich>=13.9.0",
    "typer>=0.12.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]
inference = [
    "vllm>=0.6.0",
    "auto-gptq>=0.7.0",
    "autoawq>=0.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
